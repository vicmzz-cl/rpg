<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: 'Press Start 2P', monospace;
  color: yellow;
}

.screen {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1s ease;
}

.show {
  opacity: 1;
}

.hidden {
  display: none;
}

/* animação ... */
.loadingDots::after {
  content: '';
  animation: dots 1.5s infinite steps(3);
}

@keyframes dots {
  0% { content: ''; }
  33% { content: '.'; }
  66% { content: '..'; }
  100% { content: '...'; }
}

#inputBox {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

#inputBox input {
  padding: 12px;
  font-size: 16px;
  border: 2px solid yellow;
  background: rgba(255,255,0,0);
  color: black;
  text-align: center;
  font-family: 'Press Start 2P', monospace;
}
</style>
</head>

function showScreen(id){

    const el = document.getElementById(s);
    el.classList.add("hidden");
    el.classList.remove("show");
  });

  const target = document.getElementById(id);
  target.classList.remove("hidden");

  setTimeout(() => {
    target.classList.add("show");
  }, 50);
}

document.addEventListener("keydown", () => {

  showScreen("loading");

  let loadingText = document.createElement("div");
  loadingText.className = "loadingDots";
  loadingText.style.position = "absolute";
  loadingText.style.top = "80%";
  loadingText.style.left = "50%";
  loadingText.style.transform = "translateX(-50%)";
  loadingText.innerText = "CARREGANDO";
  document.body.appendChild(loadingText);

  setTimeout(() => {
    showScreen("connecting");

    setTimeout(() => {
      loadingText.remove();
      showScreen("terminal");
      document.getElementById("inputBox").classList.remove("hidden");
    }, 5000);

  }, 5000);

}, { once: true });

document.getElementById("codeInput").addEventListener("keydown", function(e){

    this.value = "";

    showScreen("pre");
    document.getElementById("inputBox").classList.add("hidden");

    setTimeout(() => {
      showScreen("result");

      let text = document.createElement("div");
      text.style.position = "absolute";
      text.style.top = "50%";
      text.style.left = "50%";
      text.style.transform = "translate(-50%, -50%)";
      text.style.textAlign = "center";
      text.style.fontSize = "18px";
      text.style.lineHeight = "1.6";

  img.style.position = "absolute";
  img.style.top = "50%";
  img.style.left = "50%";
  img.style.transform = "translate(-50%, -50%)";
  img.style.maxWidth = "300px";

  document.body.appendChild(img);

  setTimeout(() => {
    img.remove();
    showScreen("final");

    setTimeout(() => {
      showScreen("terminal");
      document.getElementById("inputBox").classList.remove("hidden");
    }, 4000);

  }, 4000);

  return;
}

        setTimeout(() => {

      }, 5000);
